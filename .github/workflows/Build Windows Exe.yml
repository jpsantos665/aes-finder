name: Build Windows Exe
on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # Resolve o aviso de depreciação do Node.js
    
    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Retarget and Build Solution
        # O comando abaixo força o uso do conjunto de ferramentas atual (v143 do VS 2022)
        run: msbuild aes-finder.sln /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aes-finder-windows
          path: |
            **/Release/aes-finder.exe
            **/Win32/Release/aes-finder.exe
