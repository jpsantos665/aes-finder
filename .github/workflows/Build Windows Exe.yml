name: Build Windows Exe
on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Force Disable TreatWarningsAsErrors
        shell: pwsh
        run: |
          # Esse comando procura a configuração de erro e a desativa direto no arquivo do projeto
          $projFile = "msvc2013/aes-finder.vcxproj"
          if (Test-Path $projFile) {
            (Get-Content $projFile) -replace '<TreatWarningAsError>true</TreatWarningAsError>', '<TreatWarningAsError>false</TreatWarningAsError>' | Set-Content $projFile
            Write-Host "Configuração de erro removida com sucesso."
          }

      - name: Retarget and Build Solution
        run: msbuild aes-finder.sln /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /p:TreatWarningsAsErrors=false

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aes-finder-windows
          path: |
            **/Release/aes-finder.exe
            **/Win32/Release/aes-finder.exe
